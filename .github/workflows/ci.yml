name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: terraform (${{ matrix.stack }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [azure, unity-catalog]
    defaults:
      run:
        working-directory: infra/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.9.8

      - name: fmt
        run: terraform fmt -check -recursive -diff

      - name: init
        run: terraform init -backend=false -input=false

      - name: validate
        run: terraform validate

      - uses: terraform-linters/setup-tflint@90f302c255ef959cbfb4bd10581afecdb7ece3e6 # v4.1.1
        with:
          tflint_version: v0.60.0

      - name: tflint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

  python:
    name: python (ruff + pytest)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: install
        run: pip install -e ".[dev,spark]"

      - name: ruff
        run: |
          ruff check .
          ruff format --check .

      # The runner ships a JDK, so the Spark tests run here instead of skipping.
      - name: pytest
        run: pytest

  bundle:
    name: databricks bundle validate
    # Off by default: set the repository variable BUNDLE_VALIDATE=true and the
    # DATABRICKS_HOST and DATABRICKS_CLIENT_ID secrets (a service principal with a
    # GitHub OIDC federation policy) to enable it. No long-lived token is stored.
    if: ${{ vars.BUNDLE_VALIDATE == 'true' }}
    needs: python
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: bundles/sensor_telemetry
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_AUTH_TYPE: github-oidc
      DATABRICKS_CLIENT_ID: ${{ secrets.DATABRICKS_CLIENT_ID }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: databricks/setup-cli@2638c3815ee0f14bf19739abe52796911a19f288 # v0.250.0

      - name: validate dev target
        run: databricks bundle validate --target dev
